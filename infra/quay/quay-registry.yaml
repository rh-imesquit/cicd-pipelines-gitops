apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: quay-enterprise
  namespace: quay-enterprise
spec:
  components:
    - kind: postgres
      managed: true
    - kind: redis
      managed: true
    - kind: clair
      managed: true
    - kind: horizontalpodautoscaler
      managed: true
    - kind: objectstorage
      managed: true
    - kind: route
      managed: true