apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: quarkus-trigger-template
  namespace: location-pipeline
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: quarkus-pipeline-run-
      spec:
        taskRunTemplate:
          serviceAccountName: pipeline
        pipelineRef:
          name: quarkus-app-pipeline
        params:
          - name: repo-url
            value: $(tt.params.git-url)
          - name: revision
            value: $(tt.params.git-revision)
          - name: image-name
            value: "quay-quay-image-registry.apps.cluster-vg29h.vg29h.sandbox1619.opentlc.com/imesquit/locations:$(tt.params.git-revision)"
          - name: gitops-repo-url
            value: "https://github.com/rh-imesquit/cicd-pipelines-gitops.git"
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests: { storage: 1Gi }
          - name: git-auth
            secret:
              secretName: github-creds
          - name: docker-config
            secret:
              secretName: quay-auth-secret