apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-role
  namespace: app-pipeline-dev
rules:
  # Permissões para Tekton Pipelines
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelines", "tasks", "clustertasks"]
    verbs: ["get", "list", "create", "watch", "patch"]
  # Permissões para Tekton Triggers (Adicionado 'triggers' e 'interceptors')
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers", "interceptors"]
    verbs: ["get", "list", "watch"]
  # Permissões para recursos core do Kubernetes
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "configmaps", "secrets", "events"]
    verbs: ["*"]
  # Permissões para visualização de logs e status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-role-binding
  namespace: app-pipeline-dev
subjects:
  - kind: ServiceAccount
    name: pipeline-bot
    namespace: app-pipeline-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-cluster-interceptor-view
rules:
  # Necessário para o EventListener listar Interceptors globais (como o do GitHub)
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: pipeline-bot
    namespace: app-pipeline-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipeline-cluster-interceptor-view